name: Check upstream updates

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/upstream/**
      - .github/workflows/upstream.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check source changes affecting the Ukrainian edition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upstream/check.mjs
