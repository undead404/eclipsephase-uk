name: Check upstream updates

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/upstream/**
      - .github/workflows/upstream.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source changes affecting the Ukrainian edition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/upstream/check.mjs
